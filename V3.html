<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NP4XM6L6WE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-NP4XM6L6WE');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dodge Box</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="game-wrapper">

    <header id="header">
        <h1>DODGE BOX</h1>

        <div id="best-score">
            <strong>Target Score</strong>: 30
        </div>

        <div id="score">
            Score: 0
        </div>
    </header>


    <main id="game-container">

        <div id="overlay"></div>

        <div id="popup">

            <!-- WIN SCREEN -->
            <div id="win-screen" hidden>

                <div class="win-sparkles">
                    ✨ ✨ ✨ ✨ ✨
                </div>

                <div class="win-crown">
                    👑
                </div>

                <div class="win-trophy">
                    🏆
                </div>

                <h2 id="win-title">
                    WOOHOO! YOU WON!!
                </h2>

                <p id="win-score"></p>

                <div class="win-sparkles">
                    ✨ ✨ ✨ ✨ ✨
                </div>

                <button id="win-restart-btn">
                    Ready for Next Target?
                </button>

            </div>


            <!-- START SCREEN -->
            <div id="start-screen">

                <div id="challenge-modal" class="modal">

                    <div class="modal-content">

                        <h2>
                            CAN YOU BEAT 30?
                        </h2>

                        <p>
                            Let's find out!
                        </p>

                        <p class="tap-hint">
                            Tap 👇
                        </p>

                        <button id="challenge-btn">
                            Challenge Accepted!
                        </button>

                    </div>

                </div>


                <p>
                    Choose your player
                </p>


                <div id="player-choice">

                    <button
                        class="player-option"
                        data-player="🐱">
                        🐱
                    </button>

                    <button
                        class="player-option"
                        data-player="👽">
                        👽
                    </button>

                    <button
                        class="player-option"
                        data-player="🚀">
                        🚀
                    </button>

                    <button
                        class="player-option"
                        data-player="👻">
                        👻
                    </button>

                </div>


                <div id="start-content-hidden">

                    <p>
                        Avoid the falling obstacles!
                    </p>

                    <button id="start-btn">
                        Tap To Play
                    </button>

                </div>

            </div>


            <!-- GAME OVER SCREEN -->
            <div id="game-over-screen" hidden>

                <h2>
                    Game Over
                </h2>

                <p id="final-score"></p>

                <button id="restart-btn">
                    Play Again
                </button>

            </div>

        </div>


        <div id="countdown" hidden></div>


        <div id="player"></div>

        <div id="obstacle"></div>
        <div id="obstacle-two"></div>
        <div id="obstacle-three"></div>
        <div id="obstacle-four"></div>

    </main>


    <section id="controls">

        <button id="left-btn">
            ◀
        </button>

        <button id="right-btn">
            ▶
        </button>

    </section>


</div>


<script src="script.js"></script>

</body>
</html>
